name: Format

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

  fix:
    needs: check
    # Pull requests from forks get a read-only token, so the fix cannot be
    # pushed there and the failing check above is the only signal. Runs
    # started by the dispatch below are skipped here, so this cannot loop.
    if: >-
      failure() &&
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Check out pull request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Prettier
        run: npm run format

      - name: Commit and push
        id: commit
        run: |
          if git diff --quiet; then
            echo "Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --all --message "Apply Prettier"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # GitHub does not start workflow runs for pushes made with GITHUB_TOKEN,
      # so the failed check above would stay red on the formatted branch.
      # A manual dispatch does start a run, and that run only does the check.
      - name: Run the check again on the formatted branch
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run format.yml --ref "${{ github.event.pull_request.head.ref }}"
